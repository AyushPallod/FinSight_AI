version: '3.8'

services:
  # 1. Relational Database (PostgreSQL)
  postgres:
    image: postgres:15-alpine
    container_name: finsight-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password123}
      POSTGRES_DB: ${POSTGRES_DB:-finsight}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Cache & Message Broker (Redis)
  redis:
    image: redis:alpine
    container_name: finsight-redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 3. Vector Database (Qdrant)
  qdrant:
    image: qdrant/qdrant:latest
    container_name: finsight-qdrant
    restart: always
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/6333'"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 4. Local LLM Server (Ollama)
#  ollama:
#    image: ollama/ollama:latest
#    container_name: finsight-ollama
#    restart: always
#    ports:
#      - "11434:11434"
#    volumes:
#      - ollama_data:/root/.ollama
#    # Enable NVIDIA GPU access inside the container if hardware / drivers are configured
#    deploy:
#      resources:
#        reservations:
#          devices:
#            - driver: nvidia
#              count: 1
#              capabilities: [gpu]
#    healthcheck:
#      test: ["CMD", "ollama", "list"]
#      interval: 5s
#      timeout: 5s
#      retries: 5

  # 5. FastAPI Backend Application
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: finsight-backend
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password123}@postgres:5432/${POSTGRES_DB:-finsight}
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2:3b}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-e83ba56f4d2f8e12ac8bc1d6f28ef3c6759c8d35fbc08e33f381c81ef45da3c2}
    volumes:
      # Shared volume so the backend and worker share the same temporary upload folder
      - temp_uploads:/app/temp_uploads
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 6. Celery Background Task Worker
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: finsight-celery-worker
    command: celery -A app.core.celery_app worker --loglevel=info
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password123}@postgres:5432/${POSTGRES_DB:-finsight}
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2:3b}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-e83ba56f4d2f8e12ac8bc1d6f28ef3c6759c8d35fbc08e33f381c81ef45da3c2}
    volumes:
      # Shared volume matches the backend mount exactly
      - temp_uploads:/app/temp_uploads
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.core.celery_app inspect ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 7. React Frontend Application (served via static Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: finsight-frontend
    restart: always
    depends_on:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget --spider http://127.0.0.1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 8. Prometheus Metrics Scraper
  prometheus:
    image: prom/prometheus:latest
    container_name: finsight-prometheus
    restart: always
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9090/-/healthy || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 9. Grafana Visualization Dashboard
  grafana:
    image: grafana/grafana:latest
    container_name: finsight-grafana
    restart: always
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 10. Main Reverse Proxy Routing Gateway (Nginx)
  nginx:
    image: nginx:alpine
    container_name: finsight-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget --spider http://127.0.0.1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5


volumes:
  postgres_data:
  qdrant_data:
#  ollama_data:
  temp_uploads:
