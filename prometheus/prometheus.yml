global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "finsight-backend"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["backend:8000"]

  - job_name: "finsight-ragas-eval"
    metrics_path: "/api/v1/eval-metrics"
    static_configs:
      - targets: ["backend:8000"]
